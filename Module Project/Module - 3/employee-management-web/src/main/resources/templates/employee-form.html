<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} + ' - Employee Management System'">Add Employee</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <a th:href="@{/dashboard}" class="nav-brand">
            <span>🏢</span>
            <span>EMS Portal</span>
            <span class="badge-tag">Module - 3</span>
        </a>
        <ul class="nav-links">
            <li><a th:href="@{/dashboard}" class="nav-link">Dashboard</a></li>
            <li><a th:href="@{/employees}" class="nav-link active">Employees</a></li>
            <li><a th:href="@{/departments}" class="nav-link">Departments</a></li>
        </ul>
        <div class="nav-user">
            <span class="user-badge">User: <strong sec:authentication="name">admin</strong></span>
            <form th:action="@{/logout}" method="post" style="display: inline;">
                <button type="submit" class="btn-logout">Logout</button>
            </form>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container" style="max-width: 800px;">
        <div class="page-header">
            <div class="page-title">
                <h1 th:text="${pageTitle}">Add New Employee</h1>
                <p>Fill in the details below to register or update an employee in the system.</p>
            </div>
            <div class="header-actions">
                <a th:href="@{/employees}" class="btn btn-secondary btn-sm">← Back to List</a>
            </div>
        </div>

        <div class="card">
            <div class="card-body">
                <form th:action="@{/employees/save}" th:object="${employee}" method="post">
                    <!-- Hidden ID for Updates -->
                    <input type="hidden" th:field="*{id}">

                    <div class="form-grid">
                        <div class="form-group">
                            <label for="firstName">First Name *</label>
                            <input type="text" id="firstName" th:field="*{firstName}" class="form-control" placeholder="e.g. Mayank" required>
                        </div>

                        <div class="form-group">
                            <label for="lastName">Last Name *</label>
                            <input type="text" id="lastName" th:field="*{lastName}" class="form-control" placeholder="e.g. Upadhyay" required>
                        </div>

                        <div class="form-group">
                            <label for="email">Corporate Email *</label>
                            <input type="email" id="email" th:field="*{email}" class="form-control" placeholder="e.g. mayank.u@example.com" required>
                        </div>

                        <div class="form-group">
                            <label for="phone">Phone Number</label>
                            <input type="tel" id="phone" th:field="*{phone}" class="form-control" placeholder="e.g. 9876543210">
                        </div>

                        <div class="form-group">
                            <label for="designation">Job Title / Designation *</label>
                            <input type="text" id="designation" th:field="*{designation}" class="form-control" placeholder="e.g. Senior Software Engineer" required>
                        </div>

                        <div class="form-group">
                            <label for="salary">Annual Salary (INR ₹) *</label>
                            <input type="number" id="salary" th:field="*{salary}" class="form-control" placeholder="e.g. 95000" min="0" step="500" required>
                        </div>

                        <div class="form-group">
                            <label for="departmentId">Department Relationship *</label>
                            <select id="departmentId" th:field="*{departmentId}" class="form-control" required>
                                <option value="">-- Select Department --</option>
                                <option th:each="dept : ${departments}"
                                        th:value="${dept.id}"
                                        th:text="${dept.name} + ' (' + ${dept.code} + ')'">
                                </option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="role">System Role *</label>
                            <select id="role" th:field="*{role}" class="form-control" required>
                                <option value="ROLE_EMPLOYEE">ROLE_EMPLOYEE (Standard Access)</option>
                                <option value="ROLE_MANAGER">ROLE_MANAGER (Team Lead / Editor)</option>
                                <option value="ROLE_ADMIN">ROLE_ADMIN (Full Administrator)</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="joiningDate">Joining Date *</label>
                            <input type="date" id="joiningDate" th:field="*{joiningDate}" class="form-control" required>
                        </div>

                        <div class="form-group">
                            <label for="status">Employment Status *</label>
                            <select id="status" th:field="*{status}" class="form-control" required>
                                <option value="Active">Active</option>
                                <option value="On Leave">On Leave</option>
                                <option value="Inactive">Inactive</option>
                            </select>
                        </div>
                    </div>

                    <div style="margin-top: 2rem; display: flex; gap: 1rem; justify-content: flex-end;">
                        <a th:href="@{/employees}" class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary">Save Employee Record</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <footer>
        <p>© 2026 SRM-IST Java Full Stack Practical — Employee Management System (Module - 3)</p>
    </footer>
</body>
</html>
