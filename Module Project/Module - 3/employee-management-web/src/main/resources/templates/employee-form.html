<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${employee.id == null ? 'Add Employee' : 'Edit Employee'} + ' - Employee Management'">Employee Form</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <!-- Top Navigation -->
    <nav>
        <div class="nav-brand-group">
            <span class="brand-icon">🏢</span>
            <h2>Employee Management</h2>
        </div>
        <div class="nav-right">
            <a href="/employees" class="btn btn-secondary btn-sm">← Back to List</a>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="container" style="max-width: 760px;">
        <div class="form-card">
            <div class="form-header">
                <h1 th:text="${employee.id == null ? 'Add New Employee' : 'Edit Employee Record #' + employee.id}">Employee Profile</h1>
                <p class="subtitle">Complete employee details and organizational assignment.</p>
            </div>

            <form th:action="${employee.id == null} ? '/employees/save' : '/employees/update/' + ${employee.id}"
                  method="post" class="styled-form">

                <div class="form-grid">
                    <div class="form-group full-width">
                        <label for="name">Full Name *</label>
                        <input type="text" id="name" name="name" class="form-control"
                               placeholder="e.g. Mayank Upadhyay"
                               th:value="${employee.name}" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Corporate Email *</label>
                        <input type="email" id="email" name="email" class="form-control"
                               placeholder="e.g. mayank.u@example.com"
                               th:value="${employee.email}" required>
                    </div>

                    <div class="form-group">
                        <label for="salary">Annual Salary (INR ₹) *</label>
                        <input type="number" id="salary" name="salary" step="0.01" class="form-control"
                               placeholder="e.g. 95000"
                               th:value="${employee.salary}" required>
                    </div>

                    <div class="form-group">
                        <label for="departmentId">Department Assignment *</label>
                        <select id="departmentId" name="departmentId" class="form-control" required>
                            <option value="">-- Select Department --</option>
                            <option th:each="department : ${departments}"
                                    th:value="${department.id}"
                                    th:text="${department.name}"
                                    th:selected="${employee.department != null and employee.department.id == department.id}">
                                IT
                            </option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="designation">Job Title / Designation</label>
                        <input type="text" id="designation" name="designation" class="form-control"
                               placeholder="e.g. Senior Software Engineer"
                               th:value="${employee.designation}">
                    </div>

                    <div class="form-group">
                        <label for="phone">Contact Number</label>
                        <input type="tel" id="phone" name="phone" class="form-control"
                               placeholder="e.g. 9876543210"
                               th:value="${employee.phone}">
                    </div>

                    <div class="form-group">
                        <label for="status">Employment Status</label>
                        <select id="status" name="status" class="form-control">
                            <option value="Active" th:selected="${employee.status == 'Active'}">Active</option>
                            <option value="On Leave" th:selected="${employee.status == 'On Leave'}">On Leave</option>
                            <option value="Inactive" th:selected="${employee.status == 'Inactive'}">Inactive</option>
                        </select>
                    </div>
                </div>

                <div class="form-actions">
                    <a href="/employees" class="btn btn-secondary">Cancel</a>
                    <button type="submit" class="btn btn-primary">
                        💾 Save Employee Record
                    </button>
                </div>
            </form>
        </div>
    </div>

    <footer>
        <p>© 2026 SRM-IST Java Full Stack Practical • Module - 3: Employee Management System</p>
    </footer>
</body>
</html>
